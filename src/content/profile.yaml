headline: I build software that *actually* [ships.]
intro: >-
  Full stack engineer and founder of NexKeys. I take products from the first
  brief to production, for businesses in Nigeria and teams anywhere in the world.
about:
  - >-
    I started coding at 14 and have worked with real clients since 2020. Since
    then I have shipped trading platforms, marketplaces, business tools, developer
    tools and realtime multiplayer systems, and I still enjoy the moment a
    product goes live more than anything else in this job.
  - >-
    I run NexKeys, the studio I ship most of my work through, and I build
    Sellapage, a business platform used by Nigerian entrepreneurs on the web and
    on Android. I am comfortable owning a project end to end: architecture,
    backend, frontend, payments, deployment and the support that comes after.
  - >-
    Lately I spend a lot of time on AI tooling: local first coding assistants,
    codebase mapping and agent workflows that people can actually trust.
favouriteQuote: When the going gets tough, only God is enough.
saying: There's always a reason for everything.
statement: >-
  Good software is not the code you write. It is the problem that quietly stops
  existing for the people who use it.
